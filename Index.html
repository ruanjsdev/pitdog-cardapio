<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pit’s Dog</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #080604;
        color: #fff7ed;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(520px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid rgba(255, 106, 0, 0.45);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 0 36px rgba(255, 106, 0, 0.18);
      }

      h1 {
        margin: 0 0 12px;
        color: #ff8a2a;
      }

      p {
        line-height: 1.6;
      }

      code {
        display: block;
        margin: 12px 0;
        padding: 14px;
        border-radius: 12px;
        background: #16100b;
        color: #ffb36b;
      }

      a {
        color: #ff8a2a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pit’s Dog</h1>
      <p>Esse projeto precisa rodar pelo servidor do Vite para carregar React, CSS e imagens.</p>
      <p>No terminal, rode:</p>
      <code>npm run dev</code>
      <p>Depois abra:</p>
      <p><a href="http://localhost:5173/">http://localhost:5173/</a></p>
      <p>No celular, use o IP mostrado no terminal, por exemplo:</p>
      <code>http://192.168.3.200:5173/</code>
    </main>
  </body>
</html>
