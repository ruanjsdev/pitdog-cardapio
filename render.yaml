services:
  - type: web
    name: pits-dog-cardapio
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: BACKEND_API_URL
        value: https://pitsdog-api-production.up.railway.app
      - key: VITE_WHATSAPP_BOT_URL
        value: https://pits-dog-bot.onrender.com
