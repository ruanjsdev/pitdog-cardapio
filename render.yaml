services:
  - type: web
    name: pits-dog-cardapio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_WHATSAPP_BOT_URL
        value: https://pits-dog-bot.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pitsdog-api-production.up.railway.app/*
      - type: rewrite
        source: /*
        destination: /index.html
